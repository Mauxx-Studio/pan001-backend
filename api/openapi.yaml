openapi: 3.0.3
info:
  title: pan001 backend API
  description: Contrato de la API REST del backend de pan001.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Entorno local
paths:
  /:
    get:
      summary: Health check / Hola Mundo
      operationId: getHello
      responses:
        "200":
          description: El servicio está vivo.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Hola mundo con Fiber
  /health:
    get:
      summary: Health check de la API y de la base de datos
      description: Comprueba que el servidor responde y que PostgreSQL sigue accesible (hace un ping real).
      operationId: getHealth
      responses:
        "200":
          description: API y base de datos operativas.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: up
        "503":
          description: La base de datos no responde.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: base de datos no disponible
  /api/v1/auth/register:
    post:
      summary: Registrar un usuario
      description: |
        Crea un usuario con la contraseña hasheada con bcrypt (cost 12) y devuelve
        un access token JWT. Por ahora el endpoint está abierto; más adelante se
        restringirá a usuarios con rol `admin`.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body inválido (email, password, full_name o rol fuera de la lista).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "datos inválidos: email debe ser un email válido"
        "409":
          description: El email ya está registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el email ya está registrado
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: error interno del servidor
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Verifica las credenciales con bcrypt, actualiza `last_login_at` y devuelve
        el usuario con un access token nuevo.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Email o contraseña incorrectos (incluye usuarios soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email o contraseña incorrectos
        "403":
          description: El usuario está desactivado (`is_active = false`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el usuario está desactivado
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/me:
    get:
      summary: Datos del usuario autenticado
      description: |
        Devuelve el usuario dueño del access token enviado en
        `Authorization: Bearer <token>`. La ruta está protegida por el middleware
        JWT: sin un token válido responde 401.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: |
            Token ausente, con formato inválido, expirado o con firma inválida.
            También cuando el usuario del token ya no existe o está desactivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                sinToken:
                  value:
                    error: falta el header Authorization
                tokenInvalido:
                  value:
                    error: token inválido o expirado
                usuarioInexistente:
                  value:
                    error: el usuario del token ya no existe
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/contacts:
    post:
      summary: Crear un tercero
      description: |
        Crea un cliente, un proveedor o ambos. El único campo obligatorio es
        `name`; el resto es opcional. Si no se envían, `is_active` queda en
        `true` e `is_client`/`is_supplier` en `false`. Los textos se guardan sin
        espacios al inicio/fin y el email en minúsculas.
      operationId: createContact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Tercero creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Body inválido (nombre vacío, email o largo incorrectos, JSON malformado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "datos inválidos: name es obligatorio"
        "401":
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: falta el header Authorization
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Listar terceros
      description: |
        Devuelve los terceros no eliminados, ordenados por nombre. Los filtros son
        opcionales y se pueden combinar; `search` busca sin distinguir mayúsculas
        en nombre, razón social, CUIT, email, teléfono y WhatsApp.
      operationId: listContacts
      security:
        - bearerAuth: []
      parameters:
        - name: is_client
          in: query
          required: false
          description: Solo clientes (`true`) o solo los que no lo son (`false`).
          schema:
            type: boolean
        - name: is_supplier
          in: query
          required: false
          description: Solo proveedores (`true`) o solo los que no lo son (`false`).
          schema:
            type: boolean
        - name: is_active
          in: query
          required: false
          description: Solo activos (`true`) o solo desactivados (`false`).
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Texto libre para buscar en los datos principales del tercero.
          schema:
            type: string
            example: panadería
      responses:
        "200":
          description: Lista de terceros (vacía si no hay coincidencias).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "400":
          description: Un filtro booleano no es `true`/`false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: is_client debe ser true o false
        "401":
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID del tercero.
        schema:
          type: string
          format: uuid
    get:
      summary: Obtener un tercero
      operationId: getContact
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tercero encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: El `id` no es un UUID válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el id debe ser un UUID válido
        "401":
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El tercero no existe o fue eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: tercero no encontrado
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Actualizar un tercero
      description: |
        Actualización parcial: solo se modifican los campos enviados y los ausentes
        conservan su valor. `name`, si se envía, no puede quedar vacío.
      operationId: updateContact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Tercero actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Body inválido (nombre vacío, email incorrecto, JSON malformado o `id` no UUID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el nombre del tercero es obligatorio
        "401":
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El tercero no existe o fue eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: tercero no encontrado
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Eliminar un tercero
      description: Hace un soft delete (`deleted_at`); el registro deja de aparecer en la API.
      operationId: deleteContact
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tercero eliminado (sin body).
        "400":
          description: El `id` no es un UUID válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El tercero no existe o ya estaba eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: tercero no encontrado
        "500":
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (HS256) devuelto por `/api/v1/auth/register` y
        `/api/v1/auth/login`. Se envía en el header `Authorization: Bearer <token>`.
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: maria@pan001.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secreto123
        full_name:
          type: string
          minLength: 2
          maxLength: 150
          example: María Pérez
        phone:
          type: string
          maxLength: 30
          example: "1155550000"
        role:
          type: string
          enum: [admin, vendedor, panadero, cajero, supervisor]
          default: vendedor
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@pan001.com
        password:
          type: string
          format: password
          example: secreto123
    AuthResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
          description: Access token JWT (HS256) con vigencia de 24 horas.
        token_type:
          type: string
          example: Bearer
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      description: Usuario sin datos sensibles (nunca incluye password_hash).
      required: [id, email, full_name, role, is_active]
      properties:
        id:
          type: string
          format: uuid
          example: 4c04cde9-8d4b-40ef-8e39-c6d032e36b9f
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, vendedor, panadero, cajero, supervisor]
        phone:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Contact:
      type: object
      description: Tercero (cliente, proveedor o ambos) sin datos eliminados.
      required: [id, name, is_client, is_supplier, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 7a1d9f52-6c3b-4b0e-9c2a-6f1f0d8e4b21
        name:
          type: string
          maxLength: 150
          example: Panadería El Sol
        business_name:
          type: string
          maxLength: 200
          example: El Sol SRL
        tax_id:
          type: string
          maxLength: 30
          description: CUIT/CUIL o identificador fiscal.
          example: 30-12345678-9
        email:
          type: string
          format: email
          example: contacto@elsol.com
        phone:
          type: string
          maxLength: 30
          example: "1122334455"
        whatsapp:
          type: string
          maxLength: 30
          example: "1122334455"
        address:
          type: string
          maxLength: 255
          example: Av. San Martín 123
        city:
          type: string
          maxLength: 100
          example: CABA
        notes:
          type: string
          maxLength: 2000
          example: Cliente mayorista
        is_client:
          type: boolean
          example: true
        is_supplier:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateContactRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 150
          example: Panadería El Sol
        business_name:
          type: string
          maxLength: 200
          example: El Sol SRL
        tax_id:
          type: string
          maxLength: 30
          example: 30-12345678-9
        email:
          type: string
          format: email
          maxLength: 255
          example: contacto@elsol.com
        phone:
          type: string
          maxLength: 30
          example: "1122334455"
        whatsapp:
          type: string
          maxLength: 30
          example: "1122334455"
        address:
          type: string
          maxLength: 255
          example: Av. San Martín 123
        city:
          type: string
          maxLength: 100
          example: CABA
        notes:
          type: string
          maxLength: 2000
          example: Cliente mayorista
        is_client:
          type: boolean
          default: false
        is_supplier:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
    UpdateContactRequest:
      type: object
      description: Todos los campos son opcionales; los ausentes no se modifican.
      properties:
        name:
          type: string
          maxLength: 150
          description: Si se envía, no puede quedar vacío.
        business_name:
          type: string
          maxLength: 200
        tax_id:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        whatsapp:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
        is_client:
          type: boolean
        is_supplier:
          type: boolean
        is_active:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: el email ya está registrado

